<div class="bg-background text-foreground min-h-dvh transition-colors">
  <header
    class="border-border bg-background/95 sticky top-0 z-10 flex flex-wrap items-center justify-between gap-3 border-b px-4 py-3 shadow-sm backdrop-blur sm:px-6"
  >
    <a routerLink="/boards" class="text-xl font-semibold">Slingboard</a>

    <div class="flex flex-wrap items-center gap-3">
      <button type="button" hlmBtn variant="outline" size="sm" (click)="themeService.toggle()">
        {{ themeService.theme() === 'dark' ? 'Modo claro' : 'Modo escuro' }}
      </button>
      <button type="button" hlmBtn variant="ghost" size="sm" (click)="logout()">Sair</button>

      @if (authService.currentUser(); as user) {
        <div class="flex items-center gap-2 ps-1">
          <span
            class="bg-primary text-primary-foreground flex h-7 w-7 items-center justify-center rounded-full text-xs font-medium"
          >
            {{ initials(user.name) }}
          </span>
          <span class="text-muted-foreground text-sm">{{ user.name }}</span>
        </div>
      }
    </div>
  </header>

  <main class="p-4 sm:p-6">
    <router-outlet />
  </main>
</div>
