<div class="mx-auto w-full max-w-6xl space-y-6">
  <div>
    <h1 class="text-2xl font-semibold">Meus boards</h1>
    <p class="text-muted-foreground text-sm">Veja e gerencie os boards dos quais você participa.</p>
  </div>

  <div class="flex flex-wrap items-center justify-between gap-4">
    <div class="max-w-sm flex-1">
      <input hlmInput type="search" placeholder="Buscar boards..." [formControl]="searchControl" />
    </div>
    <button type="button" hlmBtn (click)="openCreateBoardDialog()">Criar Board</button>
  </div>

  @if (errorMessage()) {
    <p class="text-destructive text-sm" role="alert">{{ errorMessage() }}</p>
  }

  @if (loading()) {
    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">
      @for (i of [1, 2, 3, 4, 5, 6]; track i) {
        <div class="border-border bg-card flex flex-col gap-3 rounded-xl border p-4">
          <div class="flex items-center gap-2">
            <app-skeleton class="h-3 w-3 rounded-full" />
            <app-skeleton class="h-4 w-2/3" />
          </div>
          <app-skeleton class="h-3 w-full" />
          <app-skeleton class="h-3 w-1/2" />
          <div class="mt-auto flex items-center gap-4">
            <app-skeleton class="h-3 w-16" />
            <app-skeleton class="h-3 w-16" />
          </div>
        </div>
      }
    </div>
  } @else if (boards().length === 0) {
    <div
      class="border-border flex flex-col items-center gap-3 rounded-xl border border-dashed p-12 text-center"
    >
      <p class="text-muted-foreground text-sm">Nenhum board encontrado.</p>
      <button type="button" hlmBtn variant="outline" size="sm" (click)="openCreateBoardDialog()">
        Criar seu primeiro board
      </button>
    </div>
  } @else {
    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">
      @for (board of boards(); track board.id) {
        <app-board-card [board]="board" />
      }
    </div>
  }
</div>
